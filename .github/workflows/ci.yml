name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-rehearsal:
    name: unit-and-rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Python dependencies
        run: python3 -m pip install --requirement requirements.txt
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Install Node dependencies
        run: npm ci
      - name: Provision Playwright Chromium (release gate exit 2 otherwise)
        run: npx playwright install --with-deps chromium
      - name: Unit and integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Repository security contracts
        run: |
          python3 scripts/check_iac_contract.py
          python3 scripts/check_workflow_security.py
          python3 scripts/check_grype_exceptions.py
      - name: Synthetic production rehearsal
        run: python3 scripts/rehearse_production.py
      - name: Local synthetic load regression
        run: python3 scripts/stress_local.py
      - name: Synthetic smoke
        run: python3 scripts/smoke_e2e.py
      - name: Release checks
        run: python3 scripts/check_release.py

  postgres:
    name: postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: xray
          POSTGRES_PASSWORD: xray_ci_password
          POSTGRES_DB: xray_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xray -d xray_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://xray:xray_ci_password@localhost:5432/xray_ci?sslmode=disable
      DB_POOL_MAX: '5'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.13'
          cache: pip
      - run: python3 -m pip install --requirement requirements.txt
      - name: Apply PostgreSQL schema
        run: |
          python3 - <<'PY'
          import os, psycopg2
          from pathlib import Path
          url = os.environ['DATABASE_URL']
          schema = Path('db/schema_postgres.sql').read_text()
          conn = psycopg2.connect(url)
          conn.autocommit = True
          cur = conn.cursor()
          cur.execute(schema)
          cur.close(); conn.close()
          print('schema applied')
          PY
      - name: Live PostgreSQL tests and retained receipt
        run: |
          mkdir -p artifacts/postgres
          python3 - <<'PY'
          import json, os, platform, subprocess, sys
          from pathlib import Path
          import psycopg2
          connection = psycopg2.connect(os.environ['DATABASE_URL'])
          with connection.cursor() as cursor:
              cursor.execute('SELECT version()')
              version = cursor.fetchone()[0]
          connection.close()
          results = []
          for pattern in ('test_postgres_live.py', 'test_postgres_concurrency.py',
                          'test_idempotency_recovery.py', 'test_postgres_fencing.py',
                          'test_postgres_reconcile.py'):
              run = subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-p', pattern, '-v'],
                                   capture_output=True, text=True)
              text = run.stdout + run.stderr
              Path('artifacts/postgres/' + pattern + '.log').write_text(text)
              print(text)
              results.append({'suite': pattern, 'exit_code': run.returncode,
                              'skipped': 'skipped=' in text or '... skipped ' in text})
          receipt = {'postgres_version': version, 'python': platform.python_version(),
                     'schema_apply': 'passed in preceding step', 'connection_closed': True,
                     'suites': results, 'all_pass': all(r['exit_code'] == 0 and not r['skipped'] for r in results)}
          Path('artifacts/postgres/receipt.json').write_text(json.dumps(receipt, indent=2))
          sys.exit(0 if receipt['all_pass'] else 1)
          PY
      - name: Retain PostgreSQL version and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgres-evidence
          path: artifacts/postgres/
          retention-days: 14

  container-smoke:
    name: container-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build actual runtime image
        run: docker build -t xray-smoke .
      - name: Verify packaged dashboard and recovery module
        run: |
          set -eu
          docker run -d --name xray-smoke -p 127.0.0.1:18080:8080 xray-smoke
          trap 'docker logs xray-smoke; docker rm -f xray-smoke' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/readyz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/readyz
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/ | grep 'Project X-Ray'
          curl -fsS http://127.0.0.1:18080/app.js | grep 'loadProjects'
          curl -fsS http://127.0.0.1:18080/styles.css > /dev/null
          docker exec xray-smoke python3 -c 'import sys; sys.path.insert(0,"scripts"); import smoke_e2e'
