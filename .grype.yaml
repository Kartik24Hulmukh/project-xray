# Grype configuration for the blocking-security gate.
#
# Policy: HIGH and CRITICAL findings fail CI. Every suppression below is
# package-scoped, CVE-scoped, time-boxed and enforced by
# scripts/check_grype_exceptions.py (runs BEFORE grype in the same job).
#
# expires: 2026-10-03
# owner: security@project-xray (founder-reviewed 2026-09-13; renewal proposed 2026-09-19, REQUIRES founder countersign on PR #52 review)
# rationale: docs/security/risk-acceptance-2026-09-13.md (libuuid), docs/security/risk-acceptance-2026-09-19.md (zlib)
#
# The four CVEs below are in libuuid shipped by the pinned Alpine base of
# python:3.13-alpine. The image already runs `apk upgrade --no-cache`; the
# fixed package (util-linux 2.42.3-r0/-r1) is not yet served by the base
# image's Alpine branch, so it cannot be installed reproducibly today.
# Exposure analysis: project-xray never calls libuuid (no uuidd, no
# util-linux binaries in the runtime layer, UUIDs are generated by CPython's
# `uuid` module using os.urandom), the container runs as non-root uid 10001
# with a read-only application layer, and no attacker-controlled input
# reaches any libuuid entry point. Residual risk accepted for 14 days.
ignore:
  - vulnerability: CVE-2026-76642
    package:
      name: libuuid
      type: apk
  - vulnerability: CVE-2026-78408
    package:
      name: libuuid
      type: apk
  - vulnerability: CVE-2026-78409
    package:
      name: libuuid
      type: apk
  - vulnerability: CVE-2026-78410
    package:
      name: libuuid
      type: apk

# 2026-09-19 (PR #52 head 554de03 blocking-security failure): grype flagged
# zlib 1.3.2-r0 CVE-2026-85091 (High, EPSS 0.4%) in the Alpine base with NO
# fixed apk available on any branch the image can pull. Exposure analysis in
# docs/security/risk-acceptance-2026-09-19.md: the runtime never links zlib
# against attacker-controlled compressed input (uploads are stored as opaque
# hashed bytes and quarantined; HTTP layer is stdlib http.server with no
# Content-Encoding decompression; MAX_BODY_BYTES=2MiB). Time-boxed 14 days.
  - vulnerability: CVE-2026-85091
    package:
      name: zlib
      type: apk
